<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alura Agente</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="avatar">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="var(--accent)" />
          <rect x="30" y="35" width="40" height="30" rx="8" fill="#fff" />
          <circle cx="40" cy="50" r="5" fill="var(--accent)" />
          <circle cx="60" cy="50" r="5" fill="var(--accent)" />
          <rect x="46" y="18" width="8" height="14" rx="4" fill="#fff" />
          <circle cx="50" cy="16" r="5" fill="#fff" />
          <rect x="20" y="45" width="6" height="16" rx="3" fill="#fff" />
          <rect x="74" y="45" width="6" height="16" rx="3" fill="#fff" />
        </svg>
      </div>
      <div>
        <h1>Alura Agente</h1>
        <p>Preguntá lo que quieras sobre el reglamento interno</p>
      </div>
    </header>

    <div id="messages" class="messages">
      <div class="message bot">
        <div class="bubble">
          ¡Hola! Soy tu asistente para consultar el reglamento interno de
          trabajo. Preguntame, por ejemplo, cuántos días de vacaciones
          corresponden o qué se considera falta grave.
        </div>
      </div>
    </div>

    <form id="chat-form" class="chat-form">
      <input
        id="pregunta"
        type="text"
        placeholder="Escribí tu pregunta..."
        autocomplete="off"
        required
      />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
